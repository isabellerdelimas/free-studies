<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Free Studies</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="themePanel" class="practice-panel" aria-labelledby="welcomeTitle">
        <header class="topbar"><div><p class="eyebrow">Free Studies</p><h1 id="welcomeTitle">Make it your study space</h1></div></header>
        <form id="themeForm" class="setup-form">
          <p class="field-hint">Pick a mode and a color. Your choice previews instantly.</p>
          <fieldset class="theme-fieldset"><legend>Choose your mode</legend><div class="theme-modes">
            <label class="theme-choice"><input type="radio" name="themeMode" value="starbucks" checked><strong>Starbucks mode</strong><span>Soft charcoal, colored buttons</span></label>
            <label class="theme-choice"><input type="radio" name="themeMode" value="dark"><strong>Dark mode</strong><span>Every color, after dark</span></label>
            <label class="theme-choice"><input type="radio" name="themeMode" value="light"><strong>Light mode</strong><span>Bright colors + baby pastels</span></label>
          </div></fieldset>
          <fieldset class="theme-fieldset"><legend>Choose your color</legend><div id="colorChoices" class="color-choices"></div></fieldset>
          <label id="customColorLabel" class="custom-color hidden">Any color <input id="customColor" type="color" value="#008060"></label>
          <div class="actions"><button class="primary-button" type="submit">Continue to Free Studies</button></div>
        </form>
      </section>
      <section id="setupPanel" class="practice-panel setup-panel hidden" aria-label="Game setup">
        <header class="topbar">
          <div>
            <p class="eyebrow">Free Studies</p>
            <h1>Set up your round</h1>
          </div>
        </header>

        <button id="changeThemeButton" class="secondary-button theme-change" type="button">Change colors</button>
        <form id="setupForm" class="setup-form">
          <div class="field-row">
            <label for="playerCount">Players</label>
            <select id="playerCount" name="playerCount"></select>
          </div>

          <div id="playerFields" class="player-fields" aria-label="Player names"></div>

          <div class="field-row">
            <label for="subjectSelect">Subject</label>
            <select id="subjectSelect" name="subjectSelect"></select>
            <p id="subjectHint" class="field-hint"></p>
          </div>

          <div class="field-row">
            <label id="chapterSelectLabel" for="chapterSelect">Chapter</label>
            <select id="chapterSelect" name="chapterSelect"></select>
            <p id="chapterHint" class="field-hint"></p>
          </div>

          <div id="chapterUnitField" class="field-row hidden">
            <label for="chapterUnitSelect">Which unit of Chapter 15?</label>
            <select id="chapterUnitSelect" name="chapterUnitSelect" disabled>
              <option value="">Choose a unit</option>
              <option value="1.4">Unit 1.4 — pages 143–149</option>
              <option value="2.1">Unit 2.1 — pages 150–157</option>
            </select>
          </div>

          <div class="field-row">
            <label for="questionCount">How many questions? (up to 200)</label>
            <input id="questionCount" name="questionCount" type="number" min="1" max="200" step="1" inputmode="numeric" />
            <p id="questionCountHint" class="field-hint"></p>
          </div>

          <div id="setupError" class="feedback error hidden" role="alert"></div>

          <div class="actions">
            <button class="primary-button" type="submit">Start game</button>
          </div>
        </form>
      </section>

      <section id="gamePanel" class="practice-panel hidden" aria-label="Free Studies quiz">
        <header class="topbar">
          <div>
            <p class="eyebrow">Free Studies</p>
            <h1>Practice questions</h1>
          </div>
          <div class="score-grid" aria-label="Quiz statistics">
            <div>
              <span id="scoreValue">0</span>
              <small>Score</small>
            </div>
            <div>
              <span id="streakValue">0</span>
              <small>Streak</small>
            </div>
            <div>
              <span id="progressValue">0/0</span>
              <small>Done</small>
            </div>
          </div>
        </header>

        <div class="toolbar" aria-label="Practice controls">
          <div id="resultTabs" class="segmented-control hidden" role="group" aria-label="Result views">
            <button class="mode-button active" type="button" data-view="scores">Scores</button>
            <button class="mode-button" type="button" data-view="missed">Missed</button>
          </div>
          <div class="toolbar-actions">
            <button id="settingsButton" class="icon-button" type="button" title="New settings" aria-label="New settings">
              <span aria-hidden="true">⚙</span>
            </button>
            <button id="shuffleButton" class="icon-button" type="button" title="Shuffle questions" aria-label="Shuffle questions">
              <span aria-hidden="true">↻</span>
            </button>
          </div>
        </div>

        <div class="progress-track" aria-hidden="true">
          <div id="progressBar"></div>
        </div>

        <article class="question-card">
          <div class="question-meta">
            <span id="questionNumber">Question 1</span>
            <span id="turnLabel">Player turn</span>
            <span id="modeLabel">Science questions</span>
          </div>

          <h2 id="questionText">Loading...</h2>
          <p id="usageText" class="usage"></p>
          <figure id="mathVisual" class="math-visual hidden" aria-label="Math problem picture"></figure>

          <p id="choicesLabel" class="choices-label">Answer choices</p>
          <div id="alternatives" class="alternatives" aria-label="Answer choices"></div>
          <div id="roundSummary" class="round-summary hidden" aria-label="Final scores"></div>
          <div id="missedSummary" class="missed-summary hidden" aria-label="Missed answers"></div>

          <div id="feedback" class="feedback" aria-live="polite"></div>

          <div class="actions">
            <button id="tipButton" class="secondary-button" type="button">Show tip</button>
            <button id="nextButton" class="primary-button" type="button" disabled>Next</button>
          </div>
        </article>
      </section>
    </main>

    <script src="math-visuals.js"></script>
    <script src="quiz.js"></script>
  </body>
</html>
